[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
ignore = [
    # paste приходит через tikv-jemalloc-ctl 0.7.0 (последний выпуск); это уведомление
    # о прекращении сопровождения, не уязвимость. Замены без смены аллокатора нет.
    { id = "RUSTSEC-2024-0436", reason = "paste via tikv-jemalloc-ctl 0.7.0 (latest); unmaintained notice, not a vulnerability" },
]

[licenses]
version = 2
# Список по фактическому дереву зависимостей; новые лицензии добавляются вместе с зависимостями.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC", "CC0-1.0"]

# Собственные крейты workspace (publish = false) лицензии не имеют.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
